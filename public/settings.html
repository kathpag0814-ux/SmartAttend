<main>

<section class="welcome">

<h1>System Settings</h1>

<p>Configure SmartAttend.</p>

</section>
<div class="panel">

    <h2>
        <i class="fa-solid fa-gear"></i>
        General Settings
    </h2>

    <div class="settings-grid">

        <div class="setting-group">
            <label>School Name</label>
            <input id="schoolName" placeholder="School Name">
        </div>

        <div class="setting-group">
            <label>School Year</label>
            <input id="schoolYear" placeholder="2026-2027">
        </div>

        <div class="setting-group">
            <label>Morning Time In</label>
            <input id="morningIn" type="time">
        </div>

        <div class="setting-group">
            <label>Morning Late Time</label>
            <input id="morningLate" type="time">
        </div>

        <div class="setting-group">
            <label>Morning Time Out</label>
            <input id="morningOut" type="time">
        </div>

        <div class="setting-group">
            <label>Afternoon Time In</label>
            <input id="afternoonIn" type="time">
        </div>

        <div class="setting-group">
            <label>Afternoon Late Time</label>
            <input id="afternoonLate" type="time">
        </div>

        <div class="setting-group">
            <label>Afternoon Time Out</label>
            <input id="afternoonOut" type="time">
        </div>

    </div>

    <div class="save-area">

        <button onclick="saveSettings()">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Settings

        </button>

    </div>

</div>

<!-- =========================
CHANGE PASSWORD
========================= -->

<div class="panel">

<h2>
<i class="fa-solid fa-key"></i>
Change Password
</h2>

<div class="password-grid">

<div class="setting-group">
<label>Current Password</label>
<input type="password" id="currentPassword">
</div>

<div class="setting-group">
<label>New Password</label>
<input type="password" id="newPassword">
</div>

<div class="setting-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword">
</div>

</div>

<div class="save-area">
<button class="btn-green" onclick="changePassword()">
<i class="fa-solid fa-key"></i>
Update Password
</button>
</div>
</div>
